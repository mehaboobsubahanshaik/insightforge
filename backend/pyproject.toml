[project]
name = "insightforge-api"
version = "1.0.0"
description = "InsightForge — AI-first multi-tenant BI for SMBs (MVP 2)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic[email]>=2.7",
  "sqlalchemy[asyncio]>=2.0.30", "asyncpg>=0.29", "aiomysql>=0.2", "alembic>=1.13",
  "python-multipart>=0.0.9", "httpx>=0.27", "pyotp>=2.9",
  "cryptography>=42", "fpdf2>=2.7", "openpyxl>=3.1", "greenlet>=3",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "S"]
ignore = ["S101"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S608"]
"alembic/*" = ["E501"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]

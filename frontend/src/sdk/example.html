<!doctype html><html><head><meta charset="utf-8"><title>InsightForge SDK sample</title></head>
<body><h2>Vendor app (sample)</h2>
<div id="dash"></div><pre id="out"></pre>
<script src="/sdk/insightforge.js"></script>
<script>
  // 1) Your backend mints a token per signed-in customer (see docs/SDK.md).
  var TOKEN = new URLSearchParams(location.search).get("token");
  // 2) Secure iframe embed:
  InsightForge.embed({ container: "#dash", token: TOKEN, height: "420px" });
  // 3) Headless: same token, your own rendering:
  InsightForge.query({ token: TOKEN, formula: "sum(amount)", groupBy: "region" })
    .then(function (d) { document.getElementById("out").textContent = JSON.stringify(d, null, 1); })
    .catch(function (e) { document.getElementById("out").textContent = "Error: " + e.message; });
</script></body></html>

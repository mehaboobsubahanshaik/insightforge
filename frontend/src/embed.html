<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>InsightForge Embed</title><link rel="stylesheet" href="css/app.css">
<style>body{background:transparent;margin:0;padding:12px}.ewrap{max-width:1100px;margin:0 auto}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ecard{background:var(--surface,#fff);border:1px solid var(--border,#e5e5ef);border-radius:12px;padding:14px}
.ekpi{font-size:1.9rem;font-weight:700}.ebar{display:flex;align-items:center;gap:.5rem;margin:.25rem 0;font-size:.85rem}
.ebar i{display:block;height:10px;background:var(--accent,#6c5ce7);border-radius:5px}
.efoot{margin-top:10px;font-size:.72rem;color:#888;display:flex;justify-content:space-between}</style></head>
<body><div class="ewrap"><h1 id="e-title" style="font-weight:700;font-size:1.05rem;margin:0 0 10px" tabindex="0"></h1>
<div id="e-grid" class="egrid" role="main" aria-label="Dashboard widgets" aria-live="polite"><div class="ecard">Loading…</div></div>
<div class="efoot"><span id="e-cust"></span><span>Powered by InsightForge · governed data</span></div></div>
<script src="js/embed.js"></script></body></html>

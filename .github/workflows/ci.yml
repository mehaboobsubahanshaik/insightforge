name: ci
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: insightforge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d insightforge"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: demo_shop_mysql
          MYSQL_USER: demo
          MYSQL_PASSWORD: devpassword
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:devpassword@127.0.0.1:5432/insightforge
      REQUIRE_MYSQL: "1"   # MySQL coverage must run in CI, never silently skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install packages (ml first — backend imports it)
        run: |
          pip install -e ./ml
          pip install -e "./backend[dev]"
      - name: Lint (ruff over backend, ml, scripts)
        run: cd backend && python -m ruff check src tests ../ml ../scripts
      - name: Dependency security scan (fails on known CVEs)
        run: |
          pip install pip-audit
          pip-audit --strict --local --skip-editable
      - name: Frontend syntax (node --check every feature file)
        run: for f in frontend/src/js/*.js; do node --check "$f"; done
      - name: Migrations up (and cycle check)
        run: |
          cd backend
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Backend tests (66)
        run: cd backend && python -m pytest -q
      - name: ML tests (7)
        run: cd ml && python -m pytest -q
      - name: Compose file validates
        run: docker compose config -q
